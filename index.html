<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Hippo Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
      #unity-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #unity-canvas { width: 100% !important; height: 100% !important; }
      #unity-loading-bar { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
      #unity-progress-bar-empty { width: 200px; height: 6px; background: #333; border-radius: 3px; margin-top: 10px; }
      #unity-progress-bar-full  { width: 0; height: 6px; background: #fff; border-radius: 3px; transition: width 0.2s; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLBuild.loader.js";
      var config = {
        dataUrl:            buildUrl + "/WebGLBuild.data",
        frameworkUrl:       buildUrl + "/WebGLBuild.framework.js",
        codeUrl:            buildUrl + "/WebGLBuild.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName:        "yandexOrder",
        productName:        "yandexOrder",
        productVersion:     "1.0",
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function() {
        createUnityInstance(document.querySelector("#unity-canvas"), config, function(progress) {
          document.querySelector("#unity-progress-bar-full").style.width = (100 * progress) + "%";
        }).then(function(unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
          window.unityInstance = unityInstance;
        }).catch(function(message) {
          console.error(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
